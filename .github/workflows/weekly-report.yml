name: Weekly super-brain report

# Regenerates the Claude narrative report every Monday and commits it, so the Analytics
# page always shows a fresh firm-wide view.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build index
        run: python scripts/build_index.py
      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py
      - name: Commit refreshed data
        run: |
          git config user.name "ai-hub-bot"
          git config user.email "ai-hub-bot@users.noreply.github.com"
          git add web/data
          git diff --staged --quiet || git commit -m "chore: weekly report refresh"
          git push
