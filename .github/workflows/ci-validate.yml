name: Validate assets

# Runs on every PR: validates manifests and re-runs the sanitization scan.
# This is the automated half of the confidentiality gate; a maintainer review is the other half.

on:
  pull_request:
    paths:
      - "registry/**"
      - "scripts/**"
      - "hub-cli/**"
      - "manifest.schema.json"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate all manifests
        run: python hub-cli/hub.py validate
      - name: Re-run sanitization scan over the registry
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from common import REGISTRY, load_client_terms, scan_path
          findings = scan_path(REGISTRY, load_client_terms())
          if findings:
              print(f"::error::{len(findings)} sanitization finding(s):")
              for f, sev, kind, detail in findings:
                  print(f"  [{sev}] {kind}: {detail} ({f})")
              sys.exit(1)
          print("No secrets or blocklisted client terms found.")
          PY
      - name: Build catalog (smoke test)
        run: python scripts/build_index.py
